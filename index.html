<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Focus Home</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --accent:#2563eb;
  --accent-soft:color-mix(in srgb,var(--accent) 12%,transparent);
  --bg:#ffffff; --surface:#f5f6f8; --surface2:#eceef2; --border:#e5e7eb;
  --text:#111827; --muted:#6b7280; --danger:#dc2626;
  --shadow:0 8px 30px rgba(15,23,42,.12);
  --radius:18px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0e1014; --surface:#181b22; --surface2:#222632; --border:#2a2f3a;
  --text:#f3f4f6; --muted:#9ca3af; --danger:#f87171;
  --shadow:0 8px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
html[data-fs="s"]{font-size:14.5px} html[data-fs="l"]{font-size:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Noto Sans Thai","Segoe UI",Roboto,sans-serif;line-height:1.45;
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:1.25em;height:1.25em;flex:none}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* header */
header.top{display:flex;align-items:flex-start;gap:8px;padding:18px 0 10px}
header.top .who{flex:1;min-width:0}
.hello{font-size:.9rem;color:var(--muted)}
.name{font-size:1.6rem;font-weight:700;letter-spacing:-.01em;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.today{font-size:.85rem;color:var(--muted);margin-top:2px}
.ibtn{border:0;background:var(--surface);width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--text);flex:none}
.ibtn:active{transform:scale(.95)}
.ibtn.on{background:var(--accent);color:#fff}

/* cards */
#cards{display:flex;flex-direction:column;gap:10px;margin:6px 0 16px}
.card{background:var(--surface);border-radius:var(--radius);padding:14px 16px;position:relative}
.card-h{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);margin-bottom:6px}
.card-h .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-h button{border:0;background:none;color:var(--muted);padding:4px;margin:-4px;border-radius:8px;display:grid;place-items:center}
.card .foot{font-size:.75rem;color:var(--muted);margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.chip.warn{background:#fef3c7;color:#92400e}
:root[data-theme="dark"] .chip.warn{background:#3b2f10;color:#fbbf24}
.spin{animation:spin 1s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}

.w-main{display:flex;align-items:center;gap:12px}
.w-emo{font-size:2.5rem;line-height:1}
.w-temp{font-size:2rem;font-weight:700;line-height:1}
.w-desc{font-size:.85rem;color:var(--muted)}
.pm{margin-left:auto;text-align:center;border-radius:14px;padding:6px 10px;min-width:74px;background:color-mix(in srgb,var(--pmc) 16%,transparent);color:var(--pmc)}
.pm b{display:block;font-size:1.35rem;line-height:1.1}
.pm small{display:block;font-size:.68rem;opacity:.85}
.pm span{display:block;font-size:.72rem;font-weight:600}
.w-stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.82rem;margin-top:10px}
.w-stats span b{font-weight:600}

.big{font-size:1.15rem;font-weight:650}
.count{display:flex;align-items:baseline;gap:6px}
.count b{font-size:2rem;line-height:1;color:var(--accent)}
.trip{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit}
.trip .info{flex:1;min-width:0}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over i{background:var(--danger)}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ev{display:flex;align-items:center;gap:10px;padding:6px 0}
.ev+.ev{border-top:1px solid var(--border)}
.ev .e{font-size:1.3rem;width:1.6em;text-align:center}
.ev .n{flex:1;min-width:0}
.ev .n div:first-child{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .n div:last-child{font-size:.75rem;color:var(--muted)}
.ev .d{font-weight:700;color:var(--accent);white-space:nowrap}
.ev .d.now{color:#16a34a}
.quote{font-size:1rem;line-height:1.55;cursor:pointer}
.quote::before{content:"“";font-size:2rem;line-height:0;vertical-align:-.45em;color:var(--accent);margin-right:2px}
.linkbtn{border:0;background:var(--accent-soft);color:var(--accent);padding:6px 12px;border-radius:10px;font-size:.85rem;font-weight:600}

/* toolbar */
.tools{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0;display:flex;gap:8px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;padding:0 12px;height:42px;color:var(--muted)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;height:100%;color:var(--text)}
.search button{border:0;background:none;color:var(--muted);padding:4px;display:grid;place-items:center}
.editbar{display:flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent);border-radius:14px;padding:10px 12px;font-size:.85rem;margin-bottom:8px}
.editbar span{flex:1}

/* groups & tiles */
.grp{margin-top:10px}
.grp-h{display:flex;align-items:center;gap:6px;padding:8px 2px;font-weight:650;font-size:.95rem;user-select:none;cursor:pointer}
.grp-h .c{font-size:.75rem;color:var(--muted);font-weight:400}
.grp-h .sp{flex:1}
.grp-h .chev{transition:transform .2s;color:var(--muted)}
.grp.collapsed .chev{transform:rotate(-90deg)}
.grp.collapsed .apps{display:none}
.apps{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:14px 8px;min-height:20px}
.editing .apps{min-height:72px;border-radius:14px;outline:1.5px dashed var(--border);outline-offset:4px;padding:2px 0}
.empty-hint{grid-column:1/-1;font-size:.8rem;color:var(--muted);text-align:center;padding:18px 0}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--text);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;min-width:0;position:relative}
.ico{width:var(--ico,58px);height:var(--ico,58px);border-radius:28%;background:var(--c,#2563eb);color:#fff;display:grid;place-items:center;
  font-size:calc(var(--ico,58px)*.5);line-height:1;flex:none;box-shadow:0 2px 6px color-mix(in srgb,var(--c) 30%,transparent)}
.ico svg{width:50%;height:50%;stroke-width:2}
.ico .em{font-size:calc(var(--ico,58px)*.5)}
.tile .nm{font-size:.78rem;text-align:center;line-height:1.25;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.tile .sub{display:none}
.tile:active .ico{transform:scale(.93)}
.cols-3{--cols:3;--ico:66px}
.cols-4{--cols:4;--ico:56px}
.cols-2{--cols:2;--ico:42px}
.cols-2 .tile{flex-direction:row;background:var(--surface);border-radius:16px;padding:10px;gap:10px;align-items:center}
.cols-2 .tile .nm{text-align:left;font-size:.9rem;font-weight:550}
.view-list{--cols:1;--ico:40px;gap:2px}
.view-list .tile{flex-direction:row;padding:8px 6px;gap:12px;border-radius:12px}
.view-list .tile .txt{flex:1;min-width:0}
.view-list .tile .nm{text-align:left;font-size:.95rem;font-weight:550;-webkit-line-clamp:1}
.view-list .tile .sub{display:block;font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .txt{min-width:0;max-width:100%;display:flex;flex-direction:column;align-items:inherit}
.cols-2 .tile .txt{align-items:flex-start}
.editing .tile{touch-action:none;animation:jig .35s ease-in-out infinite alternate}
.editing .tile:nth-child(2n){animation-delay:-.2s}
@keyframes jig{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
.view-list .tile,.cols-2 .tile{animation:none!important}
.placeholder{opacity:.25}
.ghost-wrap{position:fixed!important;left:0;top:0;z-index:1000;pointer-events:none;display:block!important;outline:none!important;padding:0!important;min-height:0!important}
.ghost-wrap>*{opacity:.95;transform:scale(1.06);box-shadow:var(--shadow);border-radius:16px;background:var(--bg);animation:none!important}
.addtile{border:0;background:none;padding:0}
.addtile .ico{background:var(--surface);color:var(--muted);box-shadow:none;border:1.5px dashed var(--border)}
.addrow{margin:18px 0 6px;display:flex;justify-content:center}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;background:var(--surface);color:var(--text);display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.pri{background:var(--accent);color:#fff}
.btn.danger{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:.85rem;border-radius:10px}
.btn:disabled{opacity:.5}

/* dialogs */
dialog{border:0;padding:0;background:var(--bg);color:var(--text);width:100%;max-width:640px;margin:auto auto 0;
  border-radius:22px 22px 0 0;max-height:92vh;max-height:92dvh;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(15,23,42,.38)}
dialog[open]{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (min-width:700px){dialog{margin:auto;border-radius:22px}}
.dlg{display:flex;flex-direction:column;max-height:92vh;max-height:92dvh}
.dlg-h{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.dlg-h h2{font-size:1.1rem;margin:0;flex:1}
.dlg-b{overflow:auto;padding:12px 16px 20px;overscroll-behavior:contain}
.dlg-f{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
.dlg-f .btn{flex:1}
#dlgSettings{height:92vh;height:92dvh}
#dlgSettings .dlg{height:100%}
.sec{margin:6px 0 20px}
.sec>h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 2px 8px;font-weight:600}
.box{background:var(--surface);border-radius:16px;padding:4px 14px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;min-height:48px}
.row+.row{border-top:1px solid var(--border)}
.row>label:first-child,.row>.lbl{flex:1;min-width:0}
.row small{display:block;color:var(--muted);font-size:.75rem}
.field{display:block;margin:10px 0}
.field>span{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=url],input[type=date],input[type=number],input[type=search],select,textarea{
  width:100%;background:var(--surface);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.box input[type=text],.box input[type=url],.box select{background:var(--bg)}
textarea{min-height:140px;resize:vertical;line-height:1.5}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:7px 4px;border-radius:9px;font-size:.85rem;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--bg);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.swatches{display:flex;flex-wrap:wrap;gap:10px;padding:6px 0}
.sw{width:34px;height:34px;border-radius:50%;border:0;background:var(--c);position:relative}
.sw.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2.5px solid var(--c)}
.toggle{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:99px;background:var(--surface2);position:relative;flex:none;transition:.2s;margin:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.toggle:checked{background:var(--accent)}
.toggle:checked::after{left:21px}
.handle{border:0;background:none;color:var(--muted);touch-action:none;padding:6px;margin:-6px 0 -6px -6px;display:grid;place-items:center;cursor:grab}
.sort-list .row{background:var(--surface)}
.sort-list .placeholder{opacity:.3}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;max-height:210px;overflow:auto;padding:4px 2px}
.picker button{border:0;background:var(--surface);border-radius:12px;height:44px;display:grid;place-items:center;font-size:1.35rem;color:var(--text)}
.picker button.on{background:var(--accent);color:#fff}
.preview{display:flex;justify-content:center;padding:6px 0 4px;pointer-events:none}
.preview .tile{width:110px}
.results{margin-top:6px}
.results button{display:block;width:100%;text-align:left;border:0;background:var(--bg);border-radius:10px;padding:8px 10px;margin:4px 0}
.acts{display:flex;flex-direction:column;gap:4px;padding:8px 12px calc(12px + env(safe-area-inset-bottom))}
.acts button{border:0;background:none;text-align:left;padding:14px 12px;border-radius:12px;display:flex;gap:12px;align-items:center;font-size:1rem}
.acts button:active{background:var(--surface)}
.acts .danger{color:var(--danger)}
.acts-h{display:flex;align-items:center;gap:12px;padding:16px 20px 6px}
.acts-h .ico{--ico:44px}

/* toast / update */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111827;color:#fff;
  padding:12px 16px;border-radius:14px;font-size:.9rem;z-index:2000;box-shadow:var(--shadow);max-width:calc(100% - 32px);display:flex;gap:10px;align-items:center}
:root[data-theme="dark"] .toast{background:#f3f4f6;color:#111827}
.toast.update{background:var(--accent);color:#fff;cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div class="who">
      <div class="hello" id="hello"></div>
      <div class="name" id="dispName"></div>
      <div class="today" id="today"></div>
    </div>
    <button class="ibtn" id="btnSettings" aria-label="ตั้งค่า"></button>
  </header>

  <div id="cards"></div>

  <div class="tools">
    <label class="search"><span id="icoSearch"></span>
      <input id="q" type="search" placeholder="ค้นหาแอป" autocomplete="off" enterkeyhint="go">
      <button id="qClear" class="hidden" aria-label="ล้าง"></button>
    </label>
    <button class="ibtn" id="btnView" aria-label="มุมมอง"></button>
    <button class="ibtn" id="btnEdit" aria-label="จัดเรียง"></button>
  </div>
  <div class="editbar hidden" id="editbar"><span>ลากเพื่อเรียงหรือย้ายกลุ่ม · ลากไปที่ "ปักหมุด" เพื่อปักไว้บนสุด · แตะเพื่อแก้ไข</span><button class="btn sm pri" id="btnDone">เสร็จ</button></div>
  <div id="appsRoot"></div>
  <div class="addrow"><button class="btn" id="btnAdd"></button></div>
</div>

<!-- แก้ไขแอป -->
<dialog id="dlgApp"><form class="dlg" method="dialog" id="fApp">
  <div class="dlg-h"><h2 id="appTitle">เพิ่มแอป</h2><button type="button" class="ibtn" data-close></button></div>
  <div class="dlg-b">
    <div class="preview" id="appPreview"></div>
    <label class="field"><span>ชื่อ</span><input type="text" id="aName" maxlength="40" required></label>
    <label class="field"><span>ลิงก์ (เช่น /tripbudget/ หรือ https://…)</span><input type="text" id="aUrl" inputmode="url" autocomplete="off" required></label>
    <div class="field"><span>ไอคอน</span>
      <div class="seg" id="aIconTab"><button type="button" data-v="icon">ชุดไอคอน</button><button type="button" data-v="emoji">อีโมจิ</button></div>
      <div class="picker" id="aIconPick" style="margin-top:8px"></div>
      <input type="text" id="aEmoji" placeholder="หรือพิมพ์/วางอีโมจิเอง" maxlength="8" style="margin-top:8px">
    </div>
    <div class="field"><span>สีปุ่ม</span><div class="swatches" id="aColor"></div></div>
    <label class="field"><span>กลุ่ม</span><select id="aGroup"></select></label>
    <div class="box"><div class="row"><label for="aPin">ปักหมุดไว้บนสุด</label><input type="checkbox" class="toggle" id="aPin"></div></div>
  </div>
  <div class="dlg-f"><button type="button" class="btn danger" id="aDel">ลบ</button><button type="submit" class="btn pri">บันทึก</button></div>
</form></dialog>

<!-- เมนูกดค้าง -->
<dialog id="dlgActs"><div class="dlg"><div class="acts-h" id="actsHead"></div><div class="acts" id="actsList"></div></div></dialog>

<!-- วันสำคัญ -->
<dialog id="dlgEvent"><form class="dlg" method="dialog" id="fEvent">
  <div class="dlg-h"><h2 id="evTitle">วันสำคัญ</h2><button type="button" class="ibtn" data-close></button></div>
  <div class="dlg-b">
    <label class="field"><span>ชื่อ</span><input type="text" id="eName" maxlength="40" required placeholder="เช่น วันเกิดแม่"></label>
    <label class="field"><span>วันที่</span><input type="date" id="eDate" required></label>
    <div class="field"><span>อีโมจิ</span><div class="picker" id="eEmoPick" style="max-height:110px"></div></div>
    <div class="box"><div class="row"><label for="eYearly">ซ้ำทุกปี<small>เช่น วันเกิด วันครบรอบ</small></label><input type="checkbox" class="toggle" id="eYearly"></div></div>
  </div>
  <div class="dlg-f"><button type="button" class="btn danger" id="eDel">ลบ</button><button type="submit" class="btn pri">บันทึก</button></div>
</form></dialog>

<!-- ตั้งค่า -->
<dialog id="dlgSettings"><div class="dlg">
  <div class="dlg-h"><h2>ตั้งค่า</h2><button type="button" class="ibtn" data-close></button></div>
  <div class="dlg-b" id="setBody"></div>
</div></dialog>

<input type="file" id="fileImport" accept="application/json,.json" class="hidden">

<script>
'use strict';
/* =================== ค่าคงที่ =================== */
const KEY = 'home.v1';            // ข้อมูลตั้งค่าทั้งหมดของหน้านี้
const CKEY = 'home.v1.cache';     // ข้อมูลล่าสุดของการ์ดที่ใช้เน็ต (อากาศ, ยอดใช้จ่าย)
const PALETTE = ['#2563eb','#4f46e5','#7c3aed','#c026d3','#db2777','#dc2626','#ea580c','#d97706','#65a30d','#16a34a','#0d9488','#0891b2','#475569','#111827'];
const ICONS = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>',
  plane:'<path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/>',
  pin:'<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"/>',
  cap:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/><path d="M22 9v6"/>',
  book:'<path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/>',

function startOfDay(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
function parseDate(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number') return new Date(v < 1e12 ? v*1000 : v);
  const s = String(v).trim();
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  const d = new Date(s); return isNaN(d) ? null : d;
}
function daysUntil(d){ return Math.round((startOfDay(d) - startOfDay(new Date())) / 86400000); }

    ],

    quotes: DEFAULT_QUOTES.slice()
  };

function normalize(d){
  const def = defaults();
  if (!d || typeof d !== 'object') return def;
  const out = Object.assign({}, def, d);
  out.settings = Object.assign({}, def.settings, d.settings || {});
  out.settings.location = Object.assign({}, def.settings.location, (d.settings || {}).location || {});
  // การ์ด: เก็บลำดับเดิม + เติมใบใหม่ที่ยังไม่มี
  const cards = Array.isArray(d.cards) ? d.cards.filter(c => CARD_INFO[c.id]) : [];
  Object.keys(CARD_INFO).forEach(id => { if (!cards.find(c => c.id === id)) cards.push({id, on:true}); });
  out.cards = cards;
  out.groups = Array.isArray(d.groups) && d.groups.length ? d.groups : def.groups;
  out.apps = Array.isArray(d.apps) ? d.apps : def.apps;
  const gids = new Set(out.groups.map(g => g.id));
  out.apps.forEach(a => { if (!gids.has(a.group)) a.group = out.groups[0].id; if (!a.id) a.id = uid(); if (!a.icon) a.icon = {t:'icon', v:'link'}; });
  out.events = Array.isArray(d.events) ? d.events : [];
  out.quotes = Array.isArray(d.quotes) ? d.quotes : def.quotes;
  return out;
}
function load(){ try { return normalize(JSON.parse(localStorage.getItem(KEY))); } catch (_) { return defaults(); } }

/* --- ลากเรียง (ใช้ได้ทั้งตารางและรายการ) --- */
let suppressUntil = 0;
document.addEventListener('click', e => { if (Date.now() < suppressUntil){ e.preventDefault(); e.stopPropagation(); } }, true);
function sortable(root, o){
  let st = null;
  root.addEventListener('pointerdown', e => {
    if (e.button > 0 || (o.enabled && !o.enabled())) return;
    const h = e.target.closest(o.handle || o.item);
    if (!h || !root.contains(h)) return;
    const item = h.closest(o.item); if (!item) return;
    st = {item, x0:e.clientX, y0:e.clientY, id:e.pointerId, active:false, lastY:e.clientY};
    if (o.handle) e.preventDefault();
  });
  const move = e => {
    if (!st || e.pointerId !== st.id) return;
    if (!st.active){
      if (Math.hypot(e.clientX - st.x0, e.clientY - st.y0) < 7) return;
      begin();
    }
    e.preventDefault();
    st.lastY = e.clientY;
    st.ghost.style.transform = `translate(${e.clientX - st.dx}px,${e.clientY - st.dy}px)`;
    const el = document.elementFromPoint(e.clientX, e.clientY); if (!el) return;
    const over = el.closest(o.item);
    if (over && over !== st.item && root.contains(over)){
      const r = over.getBoundingClientRect();
      const zone = over.parentElement;
      const horiz = o.horizontal && o.horizontal(zone);
      const after = horiz ? e.clientX > r.left + r.width / 2 : e.clientY > r.top + r.height / 2;
      const ref = after ? over.nextSibling : over;
      if (ref !== st.item && st.item.nextSibling !== ref && (o.zone || zone === st.item.parentElement)) zone.insertBefore(st.item, ref);
    } else if (o.zone){
      const d = el.closest('[data-drop]');
      let zone = d && root.contains(d) ? root.querySelector(`[data-zone="${d.dataset.drop}"]`) : el.closest(o.zone);
      if (zone && root.contains(zone) && st.item.parentElement !== zone){
        const hint = zone.querySelector('.empty-hint'); if (hint) hint.remove();
        zone.appendChild(st.item);
      }
    }
  };
  function begin(){
    const r = st.item.getBoundingClientRect();
    st.dx = st.x0 - r.left; st.dy = st.y0 - r.top;
    const wrap = document.createElement('div');
    wrap.className = st.item.parentElement.className + ' ghost-wrap';
    wrap.style.width = r.width + 'px'; wrap.style.height = r.height + 'px';
    wrap.appendChild(st.item.cloneNode(true));
    document.body.appendChild(wrap); st.ghost = wrap;
    st.item.classList.add('placeholder'); st.active = true;
    navigator.vibrate?.(12);
    st.timer = setInterval(() => {
      const sc = o.scroller ? o.scroller() : null;
      const top = sc ? sc.getBoundingClientRect().top : 0, bot = sc ? sc.getBoundingClientRect().bottom : innerHeight;
      const d = st.lastY < top + 70 ? -10 : st.lastY > bot - 70 ? 10 : 0;
      if (d){ sc ? (sc.scrollTop += d) : window.scrollBy(0, d); }
    }, 16);
  }
  const end = e => {
    if (!st || (e && e.pointerId !== st.id)) return;
    const s = st; st = null;
    if (!s.active) return;
    clearInterval(s.timer); s.ghost.remove(); s.item.classList.remove('placeholder');
    suppressUntil = Date.now() + 350;
    o.onEnd(s.item);
  };
  window.addEventListener('pointermove', move, {passive:false});

function pmLevel(v){

const busy = {};
async function fetchJSON(url, ms=12000){
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(url, {signal:ctl.signal, cache:'no-store'}); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
async function refreshWeather(force){
  const L = S.settings.location, key = L.lat.toFixed(3) + ',' + L.lon.toFixed(3);
  const w = C.weather;
  if (!force && w && w.key === key && Date.now() - w.at < 20*60*1000) return;
  if (busy.weather) return; busy.weather = true; renderCards();
  try {
    const base = `latitude=${L.lat}&longitude=${L.lon}&timezone=auto`;
    const [fx, aq] = await Promise.allSettled([
      fetchJSON(`https://api.open-meteo.com/v1/forecast?${base}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,is_day,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max&forecast_days=1`),
      fetchJSON(`https://air-quality-api.open-meteo.com/v1/air-quality?${base}&current=pm2_5,pm10,us_aqi`)
    ]);
    if (fx.status !== 'fulfilled') throw fx.reason;
    const f = fx.value, a = aq.status === 'fulfilled' ? aq.value : null;
    C.weather = {
      key, at: Date.now(), ok: true,
      temp: f.current.temperature_2m, feel: f.current.apparent_temperature, hum: f.current.relative_humidity_2m,
      code: f.current.weather_code, day: f.current.is_day, wind: f.current.wind_speed_10m,
      max: f.daily?.temperature_2m_max?.[0], min: f.daily?.temperature_2m_min?.[0],
      rain: f.daily?.precipitation_probability_max?.[0], uv: f.daily?.uv_index_max?.[0],
      pm25: a?.current?.pm2_5 ?? (w && w.key === key ? w.pm25 : null), pm10: a?.current?.pm10 ?? null
    };
  } catch (e) {
    if (C.weather) C.weather.ok = false; else C.weather = null;
    C.weatherErr = Date.now();
  } finally { busy.weather = false; saveCache(); renderCards(); }
}
async function refreshSpend(force){
  const url = S.settings.spendUrl.trim(); if (!url) return;
  const s = C.spend;
  if (!force && s && s.url === url && Date.now() - s.at < 30*60*1000) return;
  if (busy.spend) return; busy.spend = true; renderCards();
  try {
    const d = new Date(), month = d.getFullYear() + '-' + pad(d.getMonth() + 1);
    const j = await fetchJSON(url + (url.includes('?') ? '&' : '?') + 'month=' + month, 20000);
    C.spend = {url, at: Date.now(), ok: true, data: j};
  } catch (e) {
    if (C.spend && C.spend.url === url) C.spend.ok = false; else C.spend = {url, at: 0, ok: false, data: null};
  } finally { busy.spend = false; saveCache(); renderCards(); }
}
function spendView(j){
  if (!j || typeof j !== 'object') return null;
  if (j.data && typeof j.data === 'object' && !Array.isArray(j.data)) j = Object.assign({}, j, j.data);
  const num = v => (v == null || v === '' || isNaN(+v)) ? null : +v;
  const total = num(j.total ?? j.spent ?? j.expense ?? j.expenses);
  if (total == null) return null;
  let cats = j.categories ?? j.byCategory ?? j.cats ?? [];
  if (!Array.isArray(cats)) cats = Object.entries(cats).map(([name, amount]) => ({name, amount}));
  cats = cats.map(c => ({name: c.name ?? c.category ?? c[0], amount: num(c.amount ?? c.total ?? c[1])})).filter(c => c.name && c.amount != null).sort((a, b) => b.amount - a.amount);
  return {total, budget: num(j.budget), income: num(j.income), cur: j.currency || '฿', month: j.month, cats, updated: j.updatedAt};
}
/* --- ทริปจาก TripBudget (อ่านอย่างเดียว) --- */
function findTrip(){
  const want = S.settings.tripKey.trim();
  let keys = [];
  try { keys = want ? [want] : Object.keys(localStorage).filter(k => /trip|^tb_/i.test(k) && !k.startsWith('home.')); } catch (_) { return null; }
  const today = startOfDay(new Date()), found = [];
  const START = ['startDate','start','departDate','departureDate','dateStart','from','startAt','depart','goDate'];
  const END = ['endDate','end','returnDate','dateEnd','to','endAt','return','backDate'];
  const pick = (o, ks) => { for (const k of ks) if (o[k] != null && o[k] !== '') return o[k]; };
  const walk = (o, depth) => {
    if (!o || typeof o !== 'object' || depth > 5) return;
    if (Array.isArray(o)){ o.forEach(x => walk(x, depth + 1)); return; }
    const sd = parseDate(pick(o, START));
    if (sd && (o.name || o.title || o.tripName || o.destination || o.country)){
      const ed = parseDate(pick(o, END)) || sd;
      found.push({name: o.name || o.title || o.tripName || o.destination || o.country, dest: o.destination || o.countryName || o.city || (o.name ? o.country : '') || '', start: sd, end: ed});
    }
    Object.values(o).forEach(v => { if (v && typeof v === 'object') walk(v, depth + 1); });
  };
  for (const k of keys){
    try { const raw = localStorage.getItem(k); if (raw) walk(JSON.parse(raw), 0); } catch (_) {}
  }
  const up = found.filter(t => startOfDay(t.end) >= today).sort((a, b) => a.start - b.start);
  return up[0] || null;
}

function nextOccurrence(ev){

  if (n < t) n = new Date(t.getFullYear() + 1, d.getMonth(), d.getDate());
  return n;
}

/* =================== Dialog + ปุ่ม Back ของ Android =================== */
const dlgStack = [], afterPop = [];
let ignorePop = 0;
function openDlg(d){
  if (ignorePop > 0){ afterPop.push(() => openDlg(d)); return; }   // รอให้ history.back() ก่อนหน้าเสร็จก่อน
  if (d.open) return;
  d.showModal(); dlgStack.push(d); history.pushState({dlg: d.id}, '');
}
function closeDlg(d){
  const i = dlgStack.lastIndexOf(d);
  if (d.open) d.close();
  if (i === -1) return;
  dlgStack.splice(i, 1); ignorePop++; history.back();
}
window.addEventListener('popstate', () => {
  if (ignorePop > 0){ ignorePop--; if (!ignorePop) afterPop.splice(0).forEach(f => f()); return; }
  const d = dlgStack.pop(); if (d && d.open) d.close();          // ปุ่ม Back ของ Android ปิดหน้าต่างบนสุด
});
$$('dialog').forEach(d => {
  d.addEventListener('cancel', e => { e.preventDefault(); closeDlg(d); });
  d.addEventListener('click', e => { if (e.target === d) closeDlg(d); });
  $$('[data-close]', d).forEach(b => { b.innerHTML = svg(UI.x); b.onclick = () => closeDlg(d); });
});

function exportData(){
  const payload = {app: 'focus-home', key: KEY, exportedAt: new Date().toISOString(), data: S};
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
  const d = new Date(), name = `focus-home-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}.json`;
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('บันทึกไฟล์ ' + name);
}
$('#fileImport').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    const data = j && j.app === 'focus-home' ? j.data : j;
    if (!data || !Array.isArray(data.apps) || !data.settings) throw new Error('bad');
    if (!confirm(`กู้คืนจากไฟล์นี้?\nแอป ${data.apps.length} ตัว · วันสำคัญ ${(data.events || []).length} วัน\nการตั้งค่าปัจจุบันจะถูกแทนที่`)) return;
    S = normalize(data); save(); delete C.weather; delete C.spend; saveCache();
    applyLook(); paintViewBtn(); renderApps(); refreshAll(true); renderSettings(); toast('กู้คืนเรียบร้อย');
  } catch (_) { toast('ไฟล์ไม่ถูกต้อง'); }
});

  const t = document.createElement('div'); t.className = 'toast update';
  t.innerHTML = `${svg(UI.refresh)} มีอัปเดต กดเพื่อโหลดใหม่`;
  t.onclick = () => { wantReload = true; t.textContent = 'กำลังโหลดใหม่…'; worker.postMessage({type: 'SKIP_WAITING'}); setTimeout(() => location.reload(), 3000); };
  document.body.appendChild(t);
}
if ('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message', e => { if (e.data?.type === 'VERSION'){ swVersion = e.data.version; if ($('#dlgSettings').open) renderSettings(); } });
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (wantReload){ wantReload = false; location.reload(); } navigator.serviceWorker.controller?.postMessage({type: 'GET_VERSION'}); });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', {scope: './'}).then(reg => {
      swReg = reg;
      navigator.serviceWorker.controller?.postMessage({type: 'GET_VERSION'});
      if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        nw?.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdate(nw); });
      });
      setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
    }).catch(err => console.warn('SW', err));
  });
}

/* =================== เริ่มทำงาน =================== */
$('#btnSettings').innerHTML = svg(UI.settings);
$('#btnEdit').innerHTML = svg(UI.move);
$('#icoSearch').innerHTML = svg(UI.search);
$('#qClear').innerHTML = svg(UI.x);
$('#btnAdd').innerHTML = svg(UI.plus) + ' เพิ่มแอป';
applyLook(); paintViewBtn(); renderApps(); refreshAll(false);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  refreshAll(false); swReg?.update().catch(() => {});
});
window.addEventListener('online', () => refreshAll(false));
window.addEventListener('offline', renderCards);
setInterval(renderHeader, 60 * 1000);
</script>
